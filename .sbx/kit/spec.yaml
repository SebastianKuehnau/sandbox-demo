schemaVersion: "2"
kind: mixin
name: sandbox-demo
displayName: sandbox-demo dev environment
description: Vaadin skills, Playwright browser deps, network access for Maven, Vaadin and GitHub

setup:
  install:
    - command: "claude plugin marketplace add vaadin/agent-marketplace && claude plugin install vaadin-skills@vaadin-marketplace"
      user: "1000"
    - command: "npm install -g @playwright/cli@latest && playwright-cli install --skills"
      user: "1000"
    # OS libraries Chromium needs to start (glib, gtk, cairo, pango, fonts, ...).
    # playwright-java downloads the browser itself on the first
    # Playwright.create(), but runs a plain `install` without `--with-deps`, so
    # the system packages are not covered. Runs as root; keep the version in
    # sync with the playwright dependency in pom.xml.
    - command: "npx --yes playwright@1.62.0 install-deps chromium"

permissions:
  network:
    allow:
      - repo.maven.apache.org
      - repo1.maven.org
      - central.sonatype.com
      - github.com
      - codeload.github.com
      - raw.githubusercontent.com
      - mcp.vaadin.com
      - www.javadocs.dev
      - vaadin.com
      - registry.npmjs.org
      - cdn.playwright.dev
      - storage.googleapis.com